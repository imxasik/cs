; Cyclone Tracker configuration
; You can edit these values without touching any .py file.
; All distances are in degrees unless noted.

[plot]
; Extra latitude/longitude padding around forecast track
buffer = 2.0

; Uncertainty growth rate for cone (deg per 6h step approx)
ucr = 0.20

; Vertical offsets for auto zoom (fine-tuning view)
minlat_offset = +0.0
maxlat_offset = -0.0

; Output image DPI
output_dpi = 300

; ---------- TOGGLES (1 = ON, 0 = OFF) ----------

; Show the NHC-style cone
show_cone = 1

; Show the legend box
show_legend = 1

; Show port markers on the map
show_ports = 1

; Legacy alias of show_approach_table: either toggle shows the same
; single merged port table (long port names are fitted automatically)
show_port_table = 0

; Show current/next movement table
show_movement_table = 1

; Show ACE box
show_ace_box = 1

; Show max observed / forecast wind boxes
show_max_wind_boxes = 1

; Show copyright / footer text
show_footer = 1

show_ai_position = no
show_bias_track = no

; Estimate & mark landfall (where/when the forecast track crosses the coast)
show_landfall = 1

; Port table: the closest ports on both sides of the landfall, with the
; distance from each port to the CURRENT centre and the direction of the
; centre as seen from that port (e.g. "Puri  450 km  SSE")
show_approach_table = 1

; Ports farther than this (km) from the forecast track are not listed
approach_radius = 800.0

; How many of the closest ports to take on each side of the landfall
; (4 -> up to 8 rows)
approach_per_side = 4

; Save plots into a year sub-folder: output/plots/2026/<Name>_Track.png
organize_by_year = 0

; Background map extent (for Map.png)
min_lat = -4.0
max_lat = 31.0
min_lon = 73.2
max_lon = 107.0

[style]
; Theme name (reserved for future use)
theme = xp

; Date format used in the plot title (Python strftime)
date_format = %HZ, %d %b %Y

; Right-hand footer text on the map (set show_footer = 0 to hide it)
footer_text = © XP WEATHER


