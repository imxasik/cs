; Cyclone Tracker configuration
; You can edit these values without touching any .py file.
; All distances are in degrees unless noted.

[plot]
; Extra latitude/longitude padding around forecast track
buffer = 2.0

; Uncertainty growth rate for cone (deg per 6h step approx)
ucr = 0.20

; Vertical offsets for auto zoom (fine-tuning view)
minlat_offset = +0.0
maxlat_offset = -0.0

; Output image DPI
output_dpi = 300

; ---------- TOGGLES (1 = ON, 0 = OFF) ----------

; Show the NHC-style cone
show_cone = 1

; Show the legend box
show_legend = 1

; Show port markers on the map
show_ports = 1

; Legacy alias of show_approach_table: either toggle shows the same
; single merged port table (long port names are fitted automatically)
show_port_table = 0

; Show current/next movement table
show_movement_table = 1

; Show ACE box
show_ace_box = 1

; Show max observed / forecast wind boxes
show_max_wind_boxes = 1

; Show copyright / footer text
show_footer = 1

show_ai_position = no
show_bias_track = no

; Estimate & mark landfall (where/when the forecast track crosses the coast)
show_landfall = 1

; Port table: the ports nearest the landfall point, with the distance from
; each port to the CURRENT centre and the direction of the centre as seen
; from that port (e.g. "Puri  450 km  SSE")
show_approach_table = 1

; Ports farther than this (km) from the forecast track are not listed
approach_radius = 800.0

; How many of the landfall's nearest ports the table lists (4 -> 4 rows)
approach_ports = 4

; ---------- FORECAST TABLE (bottom centre) ----------
; Two-row table between the port table and the movement table:
;   Time (BST) | 18/21SEP | 06/22SEP | ...
;   Speed (KM) | 46KM/H   | 56KM/H   | ...
show_forecast_table = 1

; Map key strip ("Uncertainty Cone | Forecast Track | Landfall Est.")
; drawn directly on top of the forecast table.  While it is on, those three
; entries are left out of the INTENSITY SCALE legend on the right.
show_forecast_key = 1

; Hours added to the UTC synoptic times before they are printed
; (6 = BST, Bangladesh Standard Time)
forecast_tz_offset = 6

; If a file has more forecast steps than this, the steps in between are
; dropped so the columns stay readable (first and last are always kept)
forecast_table_max_cols = 8

; Smallest font the forecast table / key strip may shrink to
forecast_table_min_fontsize = 6.8

; Map window.  0 = zoom to the forecast track (default), 1 = zoom out far
; enough to keep the whole OBSERVED track in frame as well
; (same as running with --full-track)
full_track_extent = 0

; Save plots into a year sub-folder: output/plots/2026/<Name>_Track.png
organize_by_year = 0

; Background map extent (for Map.png)
min_lat = -4.0
max_lat = 31.0
min_lon = 73.2
max_lon = 107.0

[style]
; Theme name (reserved for future use)
theme = xp

; Date format used in the plot title (Python strftime)
date_format = %HZ, %d %b %Y

; Right-hand footer text on the map (set show_footer = 0 to hide it)
footer_text = © XP WEATHER

; First cells of the two forecast-table rows, and the unit added to every
; speed cell (e.g. "46KM/H")
forecast_time_label = TIME (BST)
forecast_speed_label = WIND (KM)
forecast_speed_unit = KM/H

; What the Speed row shows:
;   wind   = forecast wind intensity in km/h (knots x 1.852)  <- reference layout
;            row then matches the knots on the track: 25KT -> 46KM/H
;   motion = storm translation speed in km/h
forecast_speed_mode = wind


