; Cyclone Tracker configuration
; You can edit these values without touching any .py file.
; All distances are in degrees unless noted.

[plot]
; Extra latitude/longitude padding around forecast track
buffer = 2.0

; Uncertainty growth rate for cone (deg per 6h step approx)
ucr = 0.20

; Vertical offsets for auto zoom (fine-tuning view)
minlat_offset = +0.0
maxlat_offset = -0.0

; Output image DPI
output_dpi = 300

; ---------- TOGGLES (1 = ON, 0 = OFF) ----------

; Show the NHC-style cone
show_cone = 1

; Show the legend box
show_legend = 1

; Show port markers on the map
show_ports = 1

; Show port distance table
show_port_table = 0

; Show current/next movement table
show_movement_table = 1

; Show ACE box
show_ace_box = 1

; Show max observed / forecast wind boxes
show_max_wind_boxes = 1

; Show copyright / footer text
show_footer = 1

show_ai_position = no
show_bias_track = no



; Background map extent (for Map.png)
min_lat = -4.0
max_lat = 31.0
min_lon = 73.2
max_lon = 107.0

